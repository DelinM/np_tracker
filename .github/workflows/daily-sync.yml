name: Disclosure sync

on:
  schedule:
    # 9:00, 12:00, and 15:30 America/New_York, covering both EST and EDT.
    # The sync skips a run that is not actually one of those local times.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "30 19 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install -r requirements.txt
      - name: Pull filings and prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/sync.py --if-due
        if: github.event_name == 'schedule'
      - name: Pull filings and prices now
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/sync.py
        if: github.event_name != 'schedule'
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/politicians data/index.json data/alerts.json data/snapshot.json data/trades.json
          if git diff --staged --quiet; then
            echo "No filing or price changes."
          else
            git commit -m "Refresh disclosed portfolios"
            git push
          fi
